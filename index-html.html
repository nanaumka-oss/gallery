<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Каталог картин Зуевой Анастасии — живопись, холст, картон. Работы современного художника.">
<meta name="keywords" content="Зуева Анастасия, картины, живопись, художник, галерея, купить картину">
<title>Каталог картин · Зуева Анастасия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- HEADER -->
<header>
  <a href="#" class="logo">Зуева <span>Анастасия</span></a>
  <a href="https://t.me/Olafsson" target="_blank" rel="noopener noreferrer" class="tg-link" aria-label="Написать в Telegram">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.5 4.5L2.5 11.5l7 2.5m12-9.5l-5 14.5-5-5m10-9.5L9.5 14"/>
    </svg>
  </a>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-eyebrow">Художественная галерея</div>
  <h1 class="hero-title">Каталог картин<br><em>Зуевой Анастасии</em></h1>
  <p class="hero-meta">Живопись · Авторские работы</p>
</section>

<!-- CONTROLS -->
<div class="controls">
  <div class="search-wrap">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="search" placeholder="Поиск по названию…" autocomplete="off" aria-label="Поиск картин">
  </div>
  <div class="filters" role="group" aria-label="Фильтр по материалу">
    <button class="filter-btn active" data-filter="all">Все</button>
    <button class="filter-btn" data-filter="холст">Холст</button>
    <button class="filter-btn" data-filter="картон">Картон</button>
  </div>
  <span class="count-badge" id="count-badge"></span>
</div>

<!-- GALLERY -->
<main class="gallery-section">
  <div class="grid" id="grid" role="list" aria-label="Каталог картин">
    <div class="empty-state" id="empty" role="alert" aria-live="polite">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <span>Ничего не найдено</span>
      <p>Попробуйте изменить запрос или сбросить фильтр</p>
    </div>
  </div>
</main>

<!-- LIGHTBOX -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Просмотр картины">
  <button class="lb-x" id="lb-close-x" aria-label="Закрыть">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="lb-inner">
    <div class="lb-img-area"><img id="lb-img" src="" alt=""></div>
    <div class="lb-info">
      <div class="lb-eyebrow">Зуева Анастасия</div>
      <h2 class="lb-title" id="lb-title"></h2>
      <div class="lb-row">
        <div class="lb-row-item">
          <span class="lb-label">Размер</span>
          <span class="lb-value" id="lb-size"></span>
        </div>
        <div class="lb-row-item">
          <span class="lb-label">Материал</span>
          <span class="lb-value" id="lb-material"></span>
        </div>
      </div>
      <button class="lb-close" id="lb-close-btn">Закрыть</button>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <div class="footer-left">Зуева Анастасия · Авторская живопись</div>
  <div class="footer-right">© 2026</div>
</footer>

<script src="script.js"></script>
</body>
</html>
